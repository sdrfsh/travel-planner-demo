# Runs lint, format check, architecture check and tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install (exactly what uv.lock says)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Architecture (layers)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
